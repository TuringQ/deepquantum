name: GPU backend CPU compatibility

on:
  pull_request:
    paths:
      - 'src/deepquantum/backends/**'
      - 'src/deepquantum/*.py'
      - 'tests/test_circuit_gpu.py'
      - 'tests/test_gpu_loader.py'
      - 'pyproject.toml'
      - '.github/workflows/test-gpu-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch and build tools
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install build pytest ruff==0.15.9
      - name: Check style and build distributions
        run: |
          ruff check .
          ruff format --check src/deepquantum/backends tests/test_circuit_gpu.py tests/test_gpu_loader.py
          python -m build
      - name: Install the wheel without the vendor SDK
        run: python -m pip install dist/*.whl
      - name: Test the installed package outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          OMP_NUM_THREADS: '2'
        run: |
          python -c "import sys, torch, deepquantum; assert not torch.cuda.is_available(); assert 'torch.utils.cpp_extension' not in sys.modules"
          python -m pytest -q \
            "${{ github.workspace }}/tests/test_gpu_loader.py" \
            "${{ github.workspace }}/tests/test_circuit_gpu.py" \
            "${{ github.workspace }}/tests/test_circuit.py" \
            "${{ github.workspace }}/tests/test_module.py"
